<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810"><rect width="1200" height="810" fill="#ffffff"/><text x="40" y="40" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#0f294a" text-anchor="start" opacity="1">Arquitectura por capas</text><text x="40" y="62" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" opacity="1">Las vistas usan componentes y validación; todo acceso a datos pasa por storage.js. Orden de carga definido en index.html.</text><rect x="340" y="90" width="520" height="84" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8" opacity="1"/><text x="600.0" y="118" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle" opacity="1">index.html</text><text x="600.0" y="140" font-family="Consolas,'Courier New',monospace" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle" opacity="1">&lt;acme-navbar&gt; · &lt;main id="view"&gt; · &lt;acme-modal&gt;</text><text x="600.0" y="157" font-family="Consolas,'Courier New',monospace" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle" opacity="1">storage → validation → components → auth → student → admin → app</text><rect x="340" y="206" width="520" height="100" rx="14" fill="#fff7ed" stroke="#d97706" stroke-width="1.8" opacity="1"/><text x="600.0" y="234" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#d97706" text-anchor="middle" opacity="1">js/app.js · Controlador</text><text x="600.0" y="256" font-family="Consolas,'Courier New',monospace" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle" opacity="1">routes + router() + guardia de acceso</text><text x="600.0" y="273" font-family="Consolas,'Courier New',monospace" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle" opacity="1">